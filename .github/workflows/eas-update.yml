# Expo Go OTA update — publishes on push to main and version tags.
# Prospects scan the QR code in Expo Go on iPhone to get the latest build.
# Soft-fails on EAS outage (continue-on-error) so CI is never blocked by a transient publish error.

name: Expo Go OTA Update

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read
  pull-requests: write

jobs:
  eas-update:
    name: Publish OTA update
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Publish OTA update to Expo Go (production channel)
        id: eas-update
        continue-on-error: true
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s)
          eas update \
            --branch production \
            --message "${COMMIT_MSG}" \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Post Expo Go launch URL as sticky commit comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sentinel = '<!-- obvious-expo-go-update:v1 -->';
            const projectId = '28a85fb2-e56c-4a53-a398-0080b43414ea';
            const expoGoUrl = `exp://u.expo.dev/${projectId}?channel=production`;
            const updateFailed = '${{ steps.eas-update.outcome }}' === 'failure';

            let body;
            if (updateFailed) {
              body = [
                sentinel,
                '## 📱 Expo Go — OTA Update',
                '',
                '> ⚠️ **OTA publish failed** — the previous build is still live in Expo Go.',
                '> Check the [Actions log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.',
                '',
                `**Expo Go URL (last good build):** [${expoGoUrl}](${expoGoUrl})`,
              ].join('\n');
            } else {
              body = [
                sentinel,
                '## 📱 Expo Go — OTA Update',
                '',
                `**Scan to launch in Expo Go:** [${expoGoUrl}](${expoGoUrl})`,
                '',
                '```',
                expoGoUrl,
                '```',
                '',
                `_Published from commit \`${{ github.sha }}\` · [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_`,
              ].join('\n');
            }

            // Post as a commit comment (sticky to the SHA)
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body,
            });

