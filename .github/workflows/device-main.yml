# .github/workflows/device-main.yml
#
# Device + Flashlight workflow
# Runs: (a) push to main — post-merge perf gate
#        (b) pull_request with 'device-screenshot' label — on-demand verification
# Does NOT run on every PR (emulator boot costs 4-8 min; too slow for the PR fast path).
#
# Known risk: Android emulator boot timeout (reactivecircus/android-emulator-runner issue #965).
# Mitigation: maestro test --retry 2 + timeout-minutes: 20 overall.
# If 3 consecutive post-merge runs fail on boot, evaluate Maestro Cloud ($250/mo/device) as fallback.
#
# EAS Free tier: 15 Android builds/month. At >15 merges/month, EAS Starter ($19/mo) is needed.
# Expected monthly burn: ~5 merges/week x 4 = ~20 builds/month; Starter plan covers this at $19/mo.

name: Device + Flashlight

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'assets/**'
      - 'maestro/**'
      - 'app.json'
      - 'performance.config.ts'
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  device-flashlight:
    name: Device screenshot + Flashlight (Android)
    if: "github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.label.name == 'device-screenshot')"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      BUNDLE_ID: com.everbetter.aaptivfeed
      EAS_PROFILE: preview

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: EAS build (Android APK, preview profile)
        id: eas-build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::error::EXPO_TOKEN secret is not configured."
            echo "::error::Add it at: https://github.com/oneilnate/Functional-Health/settings/secrets/actions"
            exit 1
          fi
          # Cloud build: ~3-5 min; avoids 8-12 min local Gradle build.
          # eas build --json outputs a JSON array with build details including artifactUrl.
          BUILD_JSON=$(eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --json \
            --wait \
            2>/dev/null)
          echo "Build output (first 500 chars): ${BUILD_JSON:0:500}"
          APK_URL=$(echo "$BUILD_JSON" | jq -r '.[0].artifacts.buildUrl // empty' 2>/dev/null || true)
          if [ -z "$APK_URL" ]; then
            echo "::error::EAS build did not return an APK URL. Check EXPO_TOKEN and build logs."
            exit 1
          fi
          echo "apk_url=$APK_URL" >> "$GITHUB_OUTPUT"
          echo "APK URL: $APK_URL"

      - name: Log EAS credit usage
        if: always()
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo '## EAS Build Credit Usage' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '**Expected monthly burn rate:**' >> "$GITHUB_STEP_SUMMARY"
          echo '- ~5 merges/week x 4 weeks = ~20 Android builds/month' >> "$GITHUB_STEP_SUMMARY"
          echo '- Free tier covers 15 builds; EAS Starter ($19/mo) recommended above 15/month' >> "$GITHUB_STEP_SUMMARY"
          echo '- Overage: ~5 builds x ~$0.06/credit = <$1 on Starter plan' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Monitor at: https://expo.dev/accounts/everbetter/billing' >> "$GITHUB_STEP_SUMMARY"
          # Non-critical: try to list recent builds for context
          eas build:list --platform android --limit 5 --non-interactive 2>/dev/null \
            >> "$GITHUB_STEP_SUMMARY" || true

      - name: Install Maestro CLI
        run: |
          curl -Ls https://get.maestro.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Install Flashlight
        run: npm install -g @perf-profiler/flashlight@latest

      - name: Download APK from EAS
        run: |
          curl -L -o app-release.apk "${{ steps.eas-build.outputs.apk_url }}"
          ls -lh app-release.apk

      # Emulator boot risk: reactivecircus/android-emulator-runner issue #965.
      # Mitigation: maestro test --retry 2, 15 min step timeout.
      - name: Boot emulator, install APK, run Maestro + Flashlight
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 15
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 6144M
          heap-size: 2048M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot-save -no-boot-anim
          script: |
            set -e
            echo 'Waiting for emulator...'
            adb wait-for-device
            adb shell input keyevent 82
            echo 'Installing APK...'
            adb install -r app-release.apk
            maestro --version
            mkdir -p maestro-results
            echo 'Running Maestro flow...'
            maestro test maestro/flows/onboarding.yaml \
              --retry 2 \
              --output maestro-results/results.json || true
            adb shell screencap -p /sdcard/device-screenshot.png
            adb pull /sdcard/device-screenshot.png maestro-results/onboarding-home.png || true
            echo 'Running Flashlight...'
            flashlight test \
              --bundleId "$BUNDLE_ID" \
              --testCommand 'maestro test maestro/flows/onboarding.yaml' \
              --resultsFilePath flashlight.json \
              --duration 15000 || true
            echo 'Emulator steps complete.'

      - name: Upload device screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-screenshots-${{ github.run_id }}
          path: maestro-results/
          if-no-files-found: warn
          retention-days: 90

      - name: Upload Flashlight results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flashlight-results-${{ github.run_id }}
          path: flashlight.json
          if-no-files-found: warn
          retention-days: 90

      - name: Inject device screenshot URLs and build scoreboard
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const art = artifacts.find(a => a.name.startsWith('device-screenshots-'));
            const urlMap = art
              ? { 'onboarding-home': `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${art.id}` }
              : {};
            fs.mkdirSync('.github', { recursive: true });
            fs.writeFileSync('.github/device-screenshot-urls.json', JSON.stringify(urlMap, null, 2));
            console.log('Screenshot URL map:', JSON.stringify(urlMap));

      - name: Build device scoreboard section
        if: always()
        run: pnpm exec tsx scripts/build-device-scoreboard.ts
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        continue-on-error: true

      - name: Post scoreboard comment (PR)
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const sentinel = '<!-- obvious-mobile-scoreboard:v1 -->';
            let body;
            try {
              body = fs.readFileSync('scoreboard-comment.md', 'utf8');
            } catch {
              body = sentinel + '\n\u26a0\ufe0f Device scoreboard generation failed.\n';
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(sentinel));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info('Updated scoreboard comment ' + existing.id);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              core.info('Created new scoreboard comment');
            }

      - name: Post scoreboard as commit comment (main push)
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const sentinel = '<!-- obvious-mobile-scoreboard:v1 -->';
            let body;
            try {
              body = fs.readFileSync('scoreboard-comment.md', 'utf8');
            } catch {
              body = sentinel + '\n\u26a0\ufe0f Device scoreboard generation failed.\n';
            }
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body,
            });
            core.info('Posted commit comment for ' + context.sha);

      - name: Enforce Flashlight regression gate
        if: always()
        run: pnpm exec tsx scripts/build-device-scoreboard.ts
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}

