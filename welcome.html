<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Welcome - MOVE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/logo_UA.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MOVE">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ========== SPLASH SCREEN ========== */
    .splash-screen {
      position: fixed;
      inset: 0;
      background: #0A0A0A;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    .splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
    }
    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .splash-screen.fade-out .splash-content {
      opacity: 0;
      transform: scale(0.95);
    }
    .splash-logo {
      width: 160px;
      height: 160px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .splash-logo img {
      width: 80px;
      height: auto;
      opacity: 0;
      filter: invert(1);
      animation: logoFadeIn 0.6s ease-out 0.3s forwards;
    }
    .splash-spinner {
      position: absolute;
      width: 140px;
      height: 140px;
      border: 3px solid transparent;
      border-top-color: #14E25A;
      border-radius: 50%;
      animation: spin 1.2s linear infinite;
    }
    .splash-spinner::before {
      content: '';
      position: absolute;
      inset: 6px;
      border: 2px solid transparent;
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite reverse;
    }
    @keyframes logoFadeIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    /* Green accent bar */
    .splash-accent {
      height: 12px;
      margin-top: 16px;
      overflow: hidden;
      animation: accentExpand 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 1s forwards;
      width: 0;
    }
    .splash-accent img {
      width: 280px;
      height: 12px;
      object-fit: cover;
    }
    @keyframes accentExpand {
      from { width: 0; }
      to { width: 280px; }
    }

    /* Powered by - slides in from below after logo animation */
    .splash-powered-by {
      margin-top: 24px;
      transform: translateY(30px);
      visibility: hidden;
      animation: poweredBySlideIn 0.6s ease-out 1.7s forwards;
    }
    .splash-powered-by img {
      width: 200px;
      height: auto;
    }
    @keyframes poweredBySlideIn {
      0% {
        visibility: visible;
        transform: translateY(30px);
      }
      100% {
        visibility: visible;
        transform: translateY(0);
      }
    }

    /* ========== WELCOME SCREEN ========== */
    body {
      background: var(--color-background);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: var(--max-width);
      margin: 0 auto;
    }

    .welcome-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: var(--space-4xl) var(--space-2xl) 60px;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity var(--transition-slow), transform var(--transition-slow);
    }
    .welcome-container.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .welcome-logo {
      width: 200px;
      margin-bottom: 80px;
    }
    .welcome-logo img {
      width: 100%;
      height: auto;
    }

    .welcome-tagline {
      font-size: var(--font-size-md);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-secondary);
      text-align: center;
      margin-bottom: 60px;
      letter-spacing: var(--letter-spacing-wide);
    }

    .welcome-title {
      font-size: var(--font-size-2xl);
      font-weight: var(--font-weight-bold);
      color: var(--color-primary-dark);
      text-align: center;
      margin-bottom: var(--space-md);
      letter-spacing: var(--letter-spacing-tight);
    }

    .welcome-subtitle {
      font-size: var(--font-size-md);
      color: var(--color-text-secondary);
      text-align: center;
      margin-bottom: var(--space-4xl);
      max-width: 280px;
      line-height: var(--line-height-normal);
    }

    .welcome-buttons {
      display: flex;
      flex-direction: column;
      gap: var(--space-lg);
      width: 100%;
      max-width: 320px;
    }

    .welcome-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: var(--space-lg) var(--space-2xl);
      border-radius: var(--radius-md);
      font-size: var(--font-size-md);
      font-weight: var(--font-weight-semibold);
      cursor: pointer;
      transition: all var(--transition-fast);
      border: none;
      font-family: var(--font-family);
    }

    .welcome-btn-primary {
      background: var(--color-primary-dark);
      color: var(--color-brand-white);
    }
    .welcome-btn-primary:hover {
      background: var(--color-primary);
      transform: translateY(-2px);
      box-shadow: var(--shadow-button);
    }

    .welcome-btn-secondary {
      background: var(--color-brand-white);
      color: var(--color-primary-dark);
      border: 2px solid var(--color-primary-dark);
    }
    .welcome-btn-secondary:hover {
      background: var(--color-primary-dark);
      color: var(--color-brand-white);
      transform: translateY(-2px);
    }

    .welcome-btn svg {
      width: 20px;
      height: 20px;
    }

    .welcome-footer {
      margin-top: auto;
      padding: var(--space-2xl);
      text-align: center;
    }

    .welcome-skip {
      font-size: var(--font-size-base);
      color: var(--color-text-secondary);
      text-decoration: none;
      cursor: pointer;
      transition: color var(--transition-fast);
    }
    .welcome-skip:hover {
      color: var(--color-primary-dark);
    }

    .welcome-terms {
      margin-top: var(--space-lg);
      font-size: var(--font-size-sm);
      color: var(--color-text-light);
      line-height: var(--line-height-normal);
    }
    .welcome-terms a {
      color: var(--color-primary);
      text-decoration: underline;
    }

    /* Social login buttons */
    .social-divider {
      display: flex;
      align-items: center;
      gap: var(--space-lg);
      margin: var(--space-2xl) 0;
      width: 100%;
      max-width: 320px;
    }
    .social-divider::before,
    .social-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--color-border);
    }
    .social-divider span {
      font-size: var(--font-size-sm);
      color: var(--color-text-light);
    }

    .social-buttons {
      display: flex;
      gap: var(--space-lg);
      width: 100%;
      max-width: 320px;
    }

    .social-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-md);
      background: var(--color-brand-white);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .social-btn:hover {
      background: var(--color-surface-hover);
      transform: translateY(-2px);
    }
    .social-btn svg {
      width: 24px;
      height: 24px;
    }
  </style>
</head>
<body>
  <!-- Splash Screen -->
  <div class="splash-screen" id="splashScreen">
    <div class="splash-content">
      <div class="splash-logo">
        <div class="splash-spinner"></div>
        <img src="assets/ua-next-logo.png" alt="UA NEXT">
      </div>
    </div>
  </div>

  <!-- Welcome Screen -->
  <div class="welcome-container" id="welcomeContainer">
    <div class="welcome-logo">
      <img src="assets/ua-next-logo.png" alt="UA NEXT">
    </div>

    <h1 class="welcome-title">Welcome</h1>
    <p class="welcome-subtitle">Track your fitness journey, connect with friends, and achieve your health goals.</p>

    <div class="welcome-buttons">
      <button class="welcome-btn welcome-btn-primary" id="loginBtn">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M11 7L9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5-5-5zm9 12h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-8v2h8v14z"/>
        </svg>
        Log In
      </button>
      <button class="welcome-btn welcome-btn-secondary" id="signupBtn">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
        Sign Up
      </button>
    </div>

    <div class="social-divider">
      <span>or continue with</span>
    </div>

    <div class="social-buttons">
      <button class="social-btn" aria-label="Continue with Apple">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
        </svg>
      </button>
      <button class="social-btn" aria-label="Continue with Google">
        <svg viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
      </button>
    </div>

    <div class="welcome-footer">
      <a class="welcome-skip" id="skipBtn">Continue as Guest</a>
      <p class="welcome-terms">
        By continuing, you agree to our<br>
        <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
      </p>
    </div>
  </div>

  <script>
    // Initialize Splash Screen
    (function initSplashScreen() {
      const splash = document.getElementById('splashScreen');
      const welcomeContainer = document.getElementById('welcomeContainer');

      if (!splash) return;

      // After splash animation, show welcome screen
      setTimeout(() => {
        splash.classList.add('fade-out');
        welcomeContainer.classList.add('visible');
      }, 3200);

      // Remove splash from DOM after fade
      setTimeout(() => {
        splash.remove();
      }, 3700);
    })();

    // Handle button clicks - go to vibeboarding first
    document.getElementById('loginBtn').addEventListener('click', function() {
      localStorage.setItem('isLoggedIn', 'true');
      window.location.href = 'vibeboarding.html';
    });

    document.getElementById('signupBtn').addEventListener('click', function() {
      localStorage.setItem('isLoggedIn', 'true');
      window.location.href = 'vibeboarding.html';
    });

    document.getElementById('skipBtn').addEventListener('click', function() {
      // Guest mode - still go through vibeboarding
      localStorage.setItem('isGuest', 'true');
      window.location.href = 'vibeboarding.html';
    });

    // Social login buttons
    document.querySelectorAll('.social-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        localStorage.setItem('isLoggedIn', 'true');
        window.location.href = 'vibeboarding.html';
      });
    });
  </script>
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js"></script>
</body>
</html>
